<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body
        {
            background-color: lightcoral;
        }
        h1 
        {
            color: rgb(97, 148, 15);
            font-size: 0..5in;
            text-align: center;
            text-transform: lowercase;
            text-shadow: 3px 3px 3px black;
        }
        p
        {
            font-size: 1.5em;
            text-align: justify;
            letter-spacing: 5px;
            line-height: 2;
        }
        #caja 
        {
            width: 100vw;
            height: 100vh;
            background-color: cyan;
        }
        #titulo
        {
            box-shadow: 3px 3px 3px black;
            background-color: yellow;
            width: 50%;
        }
        a
        {
            text-decoration: none;
        }
    </style>
</head>
<body>
    <a href="">IES Juan Bosco</a>
    <div id="caja">
        <div id="titulo">
            Esto es una subcaja
        </div>
    <h1>Unidades de medida en CSS</h1>
    <p>A diferencia de HTML que solo acepta pixeles,
        en CSS se puede indicar el tamaño de los
        elementos con distintas unidades. Por ejemplo:
        centimetros, milímetros, puntos, pixeles...
    </p>
    </div>
</body>
</html>
